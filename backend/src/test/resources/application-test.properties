spring.application.name=evault-backend-test

# H2 In-Memory Database for fast, zero-dependency testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Storage configuration for test
app.storage.local-dir=./target/test-uploads

# Security test settings
evault.security.allow-anonymous-fallback=true
evault.jwt.secret=TestSecretKeyForTestingJwtAuthenticationTokenGenerationAndValidation2026!
evault.jwt.expiration-ms=86400000
