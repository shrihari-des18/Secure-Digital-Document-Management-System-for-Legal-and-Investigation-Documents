spring.application.name=evault-backend
server.port=8080

spring.datasource.url = jdbc:postgresql://${DATABASE_URL}:5432/neondb
spring.datasource.username = ${DATABASE_USERNAME}
spring.datasource.password =${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Storage configuration (Task 1: BE-01)
app.storage.type=local
app.storage.local-dir=./data/uploads
app.storage.s3.endpoint=http://localhost:9000
app.storage.s3.bucket=evault-evidence-bucket
app.storage.s3.access-key=minioadmin
app.storage.s3.secret-key=minioadmin
app.storage.s3.region=us-east-1
app.storage.s3.retention-days=365

# Key Vault KMS Envelope Encryption (Task 2: BE-02)
app.kms.vault.url=http://localhost:8200
app.kms.vault.token=root
app.kms.vault.key-name=evault-master-kek
app.kms.enabled=true

# OpenSearch Hybrid Search (Task 4: BE-04)
app.opensearch.url=http://localhost:9200
app.opensearch.index-prefix=evault

# Security & JWT Configuration
evault.jwt.secret=SIH26190SecureDigitalDocumentVaultSecretKeyForJwtAuthenticationToken2026
evault.jwt.expiration-ms=86400000
evault.security.allow-anonymous-fallback=false

# RFC 3161 Trusted Timestamp Authority (Task BE-03)
evault.tsa.url=https://freetsa.org/tsr
evault.tsa.mode=AUTO
evault.tsa.timeout-ms=5000

# AI/ML Microservice Subsystem (Python FastAPI)
app.ai.fastapi.url=http://localhost:8000
app.ai.mock-fallback=false